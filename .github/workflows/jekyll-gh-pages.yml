# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Google Analytics 4
env:
  GA_MEASUREMENT_ID: G-F8HVYVW05H

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject GA4 and normalization script into HTML
        run: |
          sudo chown -R "$USER:$USER" ./_site
          cd ./_site

          # GA4 タグ (google*.html と挿入済みの HTML は除外)
          cat > /tmp/ga4.html <<EOF
          <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}"></script>
          <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', '${GA_MEASUREMENT_ID}');
          </script>
          EOF

          # 末尾にドットが付いたホスト名を正規化するスクリプト
          cat > /tmp/normalize.html <<'EOF'
            <script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>
          EOF

          # サブディレクトリを含むすべての HTML の <head> 直後に挿入
          find . -type f -name "*.html" -not -name "google*.html" -print0 |
            while IFS= read -r -d '' file; do
              if grep -q "googletagmanager.com/gtag/js" "$file"; then
                sed -i -e '/<head>/r /tmp/normalize.html' "$file"
              else
                sed -i -e '/<head>/r /tmp/ga4.html' -e '/<head>/r /tmp/normalize.html' "$file"
              fi
            done

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          cd ./_site
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
